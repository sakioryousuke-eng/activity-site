name: Generate activity thumbnails

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"
      - "assets/images/20*/**"

permissions:
  contents: write

concurrency:
  group: activity-thumbnails-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image processor
        run: npm install --no-save --no-package-lock sharp

      - name: Generate missing thumbnails
        run: node scripts/generate_activity_thumbnails.mjs

      - name: Commit generated files safely
        shell: bash
        run: |
          if git diff --quiet -- _data/activity_thumbnails.yml assets/images/activity-thumbnails; then
            echo "No new thumbnails were needed."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Remote main changed during generation. A later push will retry safely."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _data/activity_thumbnails.yml assets/images/activity-thumbnails
          git commit -m "活動画像サムネイルを自動生成 [skip ci]"
          git push origin HEAD:main
