---
layout: default
title: 検索
permalink: /pages/search.html
---

<section class="site-search" aria-labelledby="site-search-title">
  <header class="site-search__heading">
    <p class="site-search__eyebrow">SITE SEARCH</p>
    <h1 id="site-search-title">サイト内検索</h1>
    <p>重点課題・公約・活動・一般質問を横断して探せます。</p>
  </header>

  <form class="site-search__panel" role="search" onsubmit="return false;">
    <label class="site-search__label" for="search-input">検索キーワード</label>
    <div class="site-search__input-wrap">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.4"></circle>
        <path d="m15.6 15.6 5 5"></path>
      </svg>
      <input id="search-input" type="search" placeholder="キーワードを入力"
             autocomplete="off" inputmode="search">
    </div>
  </form>

  <div class="site-search__filters" role="group" aria-label="検索結果の種別">
    <button type="button" data-filter="all" aria-pressed="true">すべて <span data-count="all">(0)</span></button>
    <button type="button" data-filter="priority" aria-pressed="false">重点課題 <span data-count="priority">(0)</span></button>
    <button type="button" data-filter="activity" aria-pressed="false">活動 <span data-count="activity">(0)</span></button>
    <button type="button" data-filter="question" aria-pressed="false">一般質問 <span data-count="question">(0)</span></button>
    <button type="button" data-filter="promise" aria-pressed="false">公約 <span data-count="promise">(0)</span></button>
  </div>

  <p id="search-meta" class="site-search__meta" aria-live="polite">
    重点課題・公約・活動・一般質問から検索できます。
  </p>
  <div id="search-results" class="site-search__results" aria-busy="true"></div>

  <noscript><p class="site-search__notice">サイト内検索を利用するにはJavaScriptを有効にしてください。</p></noscript>
</section>

<style>

  .search-result::before {

  .search-result--priority { --result-accent: #6d2493; }

  .search-result__meta {

  @media (max-width: 600px) {

</style>

<script>
(() => {
  const BASE = ("{{ site.baseurl }}").replace(/\/+$/, "");
  const INDEX_URL = BASE + "/search.json";
  const FILTER_LABELS = {
    all: "すべて",
    priority: "重点課題",
    activity: "活動",
    question: "一般質問",
    promise: "公約"
  };
  const TYPE_LABELS = Object.assign({ site: "サイト案内" }, FILTER_LABELS);
  const FILTER_KEYS = Object.keys(FILTER_LABELS);
  const $input = document.getElementById("search-input");
  const $meta = document.getElementById("search-meta");
  const $results = document.getElementById("search-results");
  const $filterButtons = Array.from(document.querySelectorAll("[data-filter]"));

  let INDEX = [];
  let MATCHES = [];
  let activeFilter = "all";
  let loaded = false;

  function normalizeText(value) {
    return String(value || "").normalize("NFKC").toLowerCase();
  }

  function toList(value) {
    if (Array.isArray(value)) return value;
    return value ? [value] : [];
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escapeRegExp(value) {
    return value.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&");
  }

  function highlight(value, tokens) {
    const source = String(value || "");
    const terms = Array.from(new Set(tokens.filter(Boolean))).sort((a, b) => b.length - a.length);
    if (!terms.length) return escapeHtml(source);

    const pattern = new RegExp(terms.map(escapeRegExp).join("|"), "giu");
    let output = "";
    let lastIndex = 0;
    let match;

    while ((match = pattern.exec(source)) !== null) {
      output += escapeHtml(source.slice(lastIndex, match.index));
      output += "<mark>" + escapeHtml(match[0]) + "</mark>";
      lastIndex = pattern.lastIndex;
      if (match[0] === "") pattern.lastIndex += 1;
    }

    return output + escapeHtml(source.slice(lastIndex));
  }

  function brief(value, length) {
    const text = String(value || "").replace(/\s+/g, " ").trim();
    return text.length > length ? text.slice(0, length) + "…" : text;
  }

  function normalizeUrl(value) {
    const url = String(value || "").trim();
    if (!url) return "";
    if (/^https?:\/\//i.test(url)) return url;
    if (BASE && (url === BASE || url.startsWith(BASE + "/"))) return url;
    if (url.startsWith("/")) return BASE + url;
    return BASE + "/" + url;
  }

  function resultType(item) {
    if (item.type === "site") return "site";
    if (item.type === "post" || item.type === "activity") return "activity";
    if (item.type === "priority") return "priority";
    if (item.type === "question") return "question";
    if (item.type === "promise") return "promise";
    return "other";
  }

  function searchableText(item) {
    return normalizeText([
      item.title,
      item.excerpt,
      item.content,
      item.status,
      toList(item.tags).join(" "),
      toList(item.categories).join(" ")
    ].join(" "));
  }

  function scoreItem(item, query, tokens) {
    const title = normalizeText(item.title);
    const tags = toList(item.tags).map(normalizeText);
    const categories = toList(item.categories).map(normalizeText);
    const summary = normalizeText((item.excerpt || "") + " " + (item.content || ""));
    let score = 0;

    if (title === query) score += 1200;
    else if (title.startsWith(query)) score += 800;
    else if (title.includes(query)) score += 600;

    tokens.forEach(token => {
      if (title.includes(token)) score += 110;
      if (tags.some(tag => tag === token)) score += 80;
      else if (tags.some(tag => tag.includes(token))) score += 45;
      if (categories.some(category => category === token)) score += 70;
      else if (categories.some(category => category.includes(token))) score += 40;
      if (summary.includes(token)) score += 8;
    });

    return score;
  }

  function dateValue(item) {
    const value = Date.parse(item.date || "");
    return Number.isNaN(value) ? 0 : value;
  }

  function updateFilterButtons(list) {
    const counts = { all: list.length, priority: 0, activity: 0, question: 0, promise: 0 };
    list.forEach(item => {
      const type = resultType(item);
      if (Object.prototype.hasOwnProperty.call(counts, type)) counts[type] += 1;
    });

    FILTER_KEYS.forEach(key => {
      const count = document.querySelector('[data-count="' + key + '"]');
      if (count) count.textContent = "(" + counts[key] + ")";
    });

    $filterButtons.forEach(button => {
      button.setAttribute("aria-pressed", button.dataset.filter === activeFilter ? "true" : "false");
    });
  }

  function pageLabel(item) {
    const type = resultType(item);
    if (type === "priority") return "重点課題を見る";
    if (type === "activity") return "活動を見る";
    if (type === "question") return "一般質問を見る";
    if (type === "promise") return "公約を見る";
    return "ページを見る";
  }

  function renderResult(item, tokens) {
    const type = resultType(item);
    const typeLabel = TYPE_LABELS[type] || "情報";
    const pageUrl = normalizeUrl(item.url);
    const pdfUrl = normalizeUrl(item.pdf);
    const imageUrl = normalizeUrl(item.image);
    const title = String(item.title || "無題");
    const date = String(item.date || "");
    const status = String(item.status || "");
    const tags = toList(item.tags).slice(0, 5);
    const excerpt = brief(item.excerpt || item.content || "", 145);
    const hasThumb = Boolean(imageUrl);

    const thumb = hasThumb
      ? '<div class="search-result__thumb"><img src="' + escapeHtml(imageUrl) + '" alt="" loading="lazy" decoding="async"></div>'
      : "";
    const dateHtml = date
      ? '<time datetime="' + escapeHtml(date) + '">' + escapeHtml(date) + "</time>"
      : "";
    const statusHtml = status
      ? '<span class="search-result__status">' + escapeHtml(status) + "</span>"
      : "";
    const tagsHtml = tags.length
      ? '<div class="search-result__tags">' + tags.map(tag => '<span class="search-result__tag">' + escapeHtml(tag) + "</span>").join("") + "</div>"
      : "";
    const pdfHtml = pdfUrl
      ? '<a class="search-result__action search-result__action--pdf pdf-link" href="' + escapeHtml(pdfUrl) + '" data-modal="pdf" data-title="' + escapeHtml(title) + '">PDFを見る</a>'
      : "";

    return [
      '<article class="search-result search-result--' + type + (hasThumb ? " search-result--has-thumb" : "") + '">',
        '<div class="search-result__layout">',
          thumb,
          '<div class="search-result__content">',
            '<div class="search-result__meta">',
              '<span class="search-result__type">' + escapeHtml(typeLabel) + "</span>",
              dateHtml,
              statusHtml,
            "</div>",
            '<h2 class="search-result__title"><a href="' + escapeHtml(pageUrl) + '">' + highlight(title, tokens) + "</a></h2>",
            excerpt ? '<p class="search-result__excerpt">' + highlight(excerpt, tokens) + "</p>" : "",
            tagsHtml,
            '<div class="search-result__actions">',
              '<a class="search-result__action search-result__action--page" href="' + escapeHtml(pageUrl) + '">' + pageLabel(item) + "</a>",
              pdfHtml,
            "</div>",
          "</div>",
        "</div>",
      "</article>"
    ].join("");
  }

  function renderMatches(rawQuery, tokens) {
    const visible = activeFilter === "all"
      ? MATCHES
      : MATCHES.filter(item => resultType(item) === activeFilter);

    if (!visible.length) {
      $results.innerHTML =
        '<div class="site-search__empty"><p>該当する情報が見つかりませんでした。</p>' +
        '<p>検索語を減らす、別の言葉で検索する、またはタグから探してみてください。</p></div>';
    } else {
      $results.innerHTML = visible.map(item => renderResult(item, tokens)).join("");
    }

    const filterText = activeFilter === "all" ? "" : "・" + FILTER_LABELS[activeFilter];
    $meta.textContent = "「" + rawQuery + "」の結果" + filterText + "：" + visible.length + "件";
  }

  function readUrlState() {
    const params = new URLSearchParams(window.location.search);
    const filter = params.get("type") || "all";
    return {
      query: params.get("q") || "",
      filter: FILTER_KEYS.includes(filter) ? filter : "all"
    };
  }

  function writeUrlState(push) {
    const url = new URL(window.location.href);
    const query = $input.value.trim();
    if (query) url.searchParams.set("q", query);
    else url.searchParams.delete("q");
    if (activeFilter !== "all") url.searchParams.set("type", activeFilter);
    else url.searchParams.delete("type");
    history[push ? "pushState" : "replaceState"]({}, "", url);
  }

  function runSearch(updateUrl) {
    const rawQuery = $input.value.trim();
    const query = normalizeText(rawQuery);

    if (updateUrl) writeUrlState(false);

    if (!query) {
      MATCHES = [];
      updateFilterButtons(INDEX);
      $results.innerHTML = "";
      $meta.textContent = "重点課題・公約・活動・一般質問から検索できます。";
      return;
    }

    const tokens = query.split(/\s+/).filter(Boolean);
    MATCHES = INDEX
      .filter(item => {
        const text = searchableText(item);
        return tokens.every(token => text.includes(token));
      })
      .map(item => ({ item: item, score: scoreItem(item, query, tokens) }))
      .sort((a, b) => {
        return (b.score - a.score)
          || (dateValue(b.item) - dateValue(a.item))
          || String(a.item.title || "").localeCompare(String(b.item.title || ""), "ja");
      })
      .map(entry => entry.item);

    updateFilterButtons(MATCHES);
    renderMatches(rawQuery, tokens);
  }

  $filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter || "all";
      updateFilterButtons($input.value.trim() ? MATCHES : INDEX);
      writeUrlState(true);
      if ($input.value.trim()) {
        const tokens = normalizeText($input.value).trim().split(/\s+/).filter(Boolean);
        renderMatches($input.value.trim(), tokens);
      }
    });
  });

  $input.addEventListener("input", () => {
    if (loaded) runSearch(true);
  });

  window.addEventListener("popstate", () => {
    const state = readUrlState();
    $input.value = state.query;
    activeFilter = state.filter;
    if (loaded) runSearch(false);
  });

  const initialState = readUrlState();
  $input.value = initialState.query;
  activeFilter = initialState.filter;

  fetch(INDEX_URL)
    .then(response => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(data => {
      if (!Array.isArray(data)) throw new Error("検索データが配列ではありません。");
      INDEX = data;
      loaded = true;
      $results.setAttribute("aria-busy", "false");
      runSearch(false);
    })
    .catch(error => {
      console.error("search index error", error);
      $results.setAttribute("aria-busy", "false");
      $meta.textContent = "検索データを読み込めませんでした。時間をおいて再度お試しください。";
    });
})();
</script>
